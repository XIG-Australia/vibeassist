name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: The version moves when the plugin does
        run: |
          node scripts/check_plugin_version.mjs \
            --base "origin/${{ github.base_ref || github.event.repository.default_branch }}"

      - name: The map emitter still emits what the skill's template mandates
        run: node plugins/vibeassist/skills/vibeassist-map/scripts/selftest_emit_map_json.mjs